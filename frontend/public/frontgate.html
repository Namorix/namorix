<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namorix Frontgate</title>
  <link rel="stylesheet" href="/themes/dark/theme.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--nmx-color-bg);
      font-family: var(--nmx-font-sans), serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--nmx-spacing-lg);
    }

    .nmx-frontgate {
      min-height: 100vh;
      background: var(--nmx-color-bg);
      padding: var(--nmx-spacing-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nmx-frontgate__icon-box {
      padding: var(--nmx-spacing-md);
    }

    .nmx-frontgate__icon-font {
      font-size: var(--nmx-font-size-3xl);
    }

    .nmx-frontgate__card {
      max-width: 400px;
      text-align: center;
      padding: var(--nmx-spacing-3xl);
    }

    .nmx-frontgate__header-title {
      font-size: var(--nmx-font-size-xl);
      font-weight: var(--nmx-font-weight-medium);
    }

    .nmx-frontgate__header-description {
      font-size: var(--nmx-font-size-sm);
      line-height: var(--nmx-line-height-relaxed);
    }

    .nmx-frontgate__meta-list {
      padding-top: var(--nmx-spacing-lg);
    }

    .nmx-frontgate-list__item {
        font-size: var(--nmx-font-size-xs);
    }
  </style>
</head>
<body>
  <div class="nmx-frontgate">
    <div class="nmx-card nmx-frontgate__card">
      <div class="nmx-icon-box nmx-icon-box--success nmx-frontgate__icon-box">
        <span class="nmx-icon-font ic-security nmx-frontgate__icon-font" aria-hidden="true"></span>
      </div>
      <div class="nmx-card__header">
        <h2 class="nmx-card__header-title nmx-frontgate__header-title">Namorix Frontgate</h2>
        <p class="nmx-card__header-description nmx-frontgate__header-description">
          Reverse proxy is running. Configure routing rules from the Frontgate addon
          in the Namorix desktop to start proxying traffic.
        </p>
      </div>
      <div class="nmx-meta-list nmx-frontgate__meta-list">
        <div class="nmx-meta-list__item nmx-frontgate-list__item">
          <span class="nmx-meta-list__item-label">Status</span>
          <span class="nmx-meta-list__item-value nmx-meta-list__item-value--end nmx-meta-list__item-value--success">Active</span>
        </div>
        <div class="nmx-meta-list__item nmx-frontgate-list__item">
          <span class="nmx-meta-list__item-label">Timestamp</span>
          <span class="nmx-meta-list__item-value nmx-meta-list__item-value--end" id="frontgate-timestamp"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('frontgate-timestamp').textContent = new Date().toISOString();
  </script>
</body>
</html>
