syntax = "proto3";

option csharp_namespace = "Namorix.Core.Protos";

service AddonChannel {
  rpc Connect(stream AddonMessage) returns (stream ShellMessage);
  // Addon backend (confidential client) exchanges a user's authorization code
  // for tokens. Caller authenticates via the addon's machine token on the
  // gRPC authorization header; client_assertion proves the addon owns the code.
  rpc ExchangeUserCode(ExchangeCodeRequest) returns (OAuthTokenResult);
  // Addon backend refreshes a user's access token using the stored refresh token.
  rpc RefreshUserToken(RefreshTokenRequest) returns (OAuthTokenResult);
  // Public key(s) the desktop signs addon access tokens with. Delivered on the
  // authenticated channel on purpose: the desktop is the only auth server, so an
  // addon that cannot reach it must not be able to verify tokens either.
  rpc GetJwks(JwksRequest) returns (JwksResponse);
  // Addon-initiated logout: the addon asks the desktop to kill the one session it holds for
  // this user. Scope is (user_id, session_id, the calling addon) — never the user's other
  // sessions, and never their grants at other addons. Idempotent: a session that is already
  // gone is not an error.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // Who exists on this desktop. An addon otherwise only ever sees a numeric user id, so
  // without this it cannot render a picker — "share this camera with whom?" has no answer.
  //
  // An empty query lists the directory, which is what a picker needs: it shows every name at
  // once instead of making the owner guess a substring. The caller already holds a machine
  // token, so hiding names buys nothing. Email stays a match key that is never echoed back —
  // an address cannot be confirmed by probing — and password hashes never leave the desktop.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // The other direction: given ids the addon already stored (a row it wrote weeks ago, whose
  // user it never rendered a name for), who are they? Search cannot answer this — it only
  // matches on text — so without it an addon can only ever show "user 42".
  //
  // Reads as "resolve what I hold" rather than "discover", but that is framing, not a
  // restriction: ids are sequential, so a caller wanting the whole directory can walk them.
  // The cap bounds one call, not the total.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

message AddonMessage {
  string type = 1;       // "widget-event", "log", "heartbeat"
  string payload = 2;    // JSON payload
  int64 timestamp = 3;
}

message ShellMessage {
  string type = 1;       // "command", "config-update", "handshake", "session-revoked", "session-grants", "heartbeat-ack"
  string payload = 2;
  string message_id = 3;
}

message ExchangeCodeRequest {
  string code = 1;
  string code_verifier = 2;
  string client_assertion = 3;
  string client_id = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_id = 2;
}

message RevokeGrantRequest {
  // Which user's session to kill. The client id is not sent: it is taken from the machine
  // token on the call, so an addon can only ever revoke sessions it owns.
  int64 user_id = 1;
  // Which of that user's sessions. Required — revoking without it would sign the user out
  // of every other browser they have open, which is the desktop's logout-all, not this.
  string session_id = 2;
}

message RevokeGrantResponse {}

message OAuthTokenResult {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  int64 user_id = 4;
  // Names the refresh chain this pair belongs to, stable across rotation. The addon
  // keys its grant row by (client_id, session_id) so one user can hold several
  // sessions on one addon and signing out of one leaves the rest alone.
  string session_id = 5;
}

message SearchUsersRequest {
  // Matched against username, display name and email. Empty lists everyone, which is what a
  // picker wants; a term narrows it.
  string query = 1;
  // Clamped by the desktop to [1, 200]. Zero or less means the desktop's default.
  int32 limit = 2;
  // Rows to skip, for callers reaching past the cap. Negative is treated as zero.
  int32 offset = 3;
}

message SearchUsersResponse {
  repeated AddonUser users = 1;
}

message GetUsersRequest {
  // Clamped by the desktop to 50 ids per call, and non-positive ids are dropped. A caller
  // wanting more than that sends another batch.
  repeated int64 user_ids = 1;
}

message GetUsersResponse {
  // Only the ids that exist. A missing one is simply absent — the desktop does not say
  // whether an id was never a user or was deleted, because the caller cannot act on it.
  repeated AddonUser users = 1;
}

message AddonUser {
  // The same id the addon receives as OAuthTokenResult.user_id, so it can be compared and
  // stored without a second lookup.
  int64 user_id = 1;
  string username = 2;
  string name = 3;
}

message JwksRequest {}

message JwksResponse {
  // Newest first. More than one entry only during a key rotation overlap.
  repeated AddonSigningKey keys = 1;
}

message AddonSigningKey {
  string kid = 1;
  // SubjectPublicKeyInfo, PEM. The only consumer is a .NET addon, and the
  // transport is gRPC, so PEM beats hand-encoding JWK n/e as base64url bignums.
  string public_key_pem = 2;
}